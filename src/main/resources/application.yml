spring:
  application:
    name: payroll-sync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:payroll_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

payroll:
  audit:
    secret-key: ${PAYROLL_AUDIT_SECRET:SuperSecretHmacKeyForFinancialAuditLogs2026}
  sepa:
    initiating-party-name: "Enterprise PayrollSync Corp"
    debtor-name: "Enterprise PayrollSync Corp HQ"
    debtor-iban: "DE89370400440532013000"
    debtor-bic: "COBA234XXX"

server:
  port: 8080
